# ドキュメント（docs/）を MkDocs で HTML のサイトにする設定。
#
# リポジトリの直下で実行する（privacy プラグインの cache_dir は実行した場所から数えるため）。
#
#   pip install --require-hashes -r tools/mkdocs/requirements.txt
#   mkdocs serve -f tools/mkdocs/mkdocs.yml             手元で見る（http://127.0.0.1:8000/）
#   mkdocs build --strict -f tools/mkdocs/mkdocs.yml    work/site/ に書き出す（CI と同じ。リンク切れ・アンカー切れで失敗する）
#
# docs_dir・site_dir・hooks のパスは、このファイルのある場所から数える。
# docs/ の Markdown は GitHub でもそのまま読めるように書いたものを変えずに使う。
# GitHub との違いは hooks.py で埋める（docs/ の外へのリンク）。
# 公開は .github/workflows/docs.yml が main の更新ごとに GitHub Pages へ行う。
site_name: tebunko
site_url: https://hsgwa.github.io/tebunko/
site_description: Office ファイルを中身の文字で一括検索する Windows 用ツール tebunko の使い方・安全性・設計
repo_url: https://github.com/hsgwa/tebunko
repo_name: hsgwa/tebunko
edit_uri: edit/main/docs/
copyright: Copyright (c) 2026 hsgwa / MIT License

docs_dir: ../../docs
# 生成物は work/ に置く（.gitignore 済み）
site_dir: ../../work/site

hooks:
  - hooks.py

theme:
  name: material
  # 先頭ページのテンプレート（overrides/home.html）を置く場所
  custom_dir: overrides
  language: ja
  logo: images/logo.svg
  favicon: images/logo.svg
  # Google Fonts を使わず、閲覧者の OS のフォントで表示する（既定の Roboto は日本語を含まないため見た目もほぼ変わらない）
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    # 色はロゴに合わせて docs/stylesheets/extra.css で決める
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークモードにする
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードにする

plugins:
  - search:
      lang: ja
  # 外部のサーバー（unpkg など）から読み込むものを、ビルドのときに取り込んで自前で配信する。
  # 閲覧者のブラウザーが第三者のサーバーへ通信しないようにする（本ツールは通信をしないことを前提にしている）
  - privacy:
      # 取り込んだファイルの置き場所（work/ は git の管理外）
      cache_dir: work/cache/privacy

# Material テーマは Mermaid を unpkg から読み込む。先にここで読み込ませると、テーマは読み込みを省く。
# 外部の URL は privacy プラグインがビルドのときに取り込むため、閲覧者は unpkg へ通信しない。
# 版は Material テーマが読み込む版（mermaid@11）に合わせて固定する
extra_javascript:
  - https://unpkg.com/mermaid@11.17.2/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      # 見出しのアンカーを GitHub と同じ形にする（日本語を残し、記号を除き、英字を小文字にする）。
      # docs/ の中のリンクは GitHub の形のアンカーで書いている
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # ```mermaid のブロックを図として描く
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# 上部のタブ（navigation.tabs）は読む人で分ける: 「使い方」は使う人（利用者と、導入を審査する人）、
# 「開発者向け」は作る人。その中は目的ごとのまとまり（navigation.sections）に分ける。ページを足したらここにも足す
nav:
  - ホーム: index.md
  - 使い方:
      - guide/index.md
      - 導入:
          - インデックスの仕組み: guide/about-index.md
          - クイックスタート: guide/quickstart.md
      - 操作ガイド:
          - インデックスの作成: guide/indexing.md
          - 検索: guide/search.md
          - 元のファイルを開く: guide/open-files.md
          - 高速検索: guide/fast-search.md
          - 設定: guide/settings.md
          - Office プロセスの停止: guide/process.md
      # 安全性は、導入を審査する人（情報システム部門など）向け。ファイルは docs/safety/ に置く
      - 運用管理:
          - 安全性:
              - safety/index.md
              - 危険とされる処理の検査結果: safety/checks.md
              - ファイルの読み書きの範囲: safety/file-access.md
              - 開示事項: safety/disclosure.md
              - 第三者のツールによる検査結果: safety/scans.md
              - 供給網とライセンス: safety/supply-chain.md
          - 更新とアンインストール: guide/update-uninstall.md
      - サポート・リファレンス:
          - トラブルシューティング: guide/troubleshooting.md
          - よくある質問: guide/faq.md
          - 制限事項: guide/limitations.md
          - キーボード操作: guide/keyboard.md
          # 利用者が見るメッセージの一覧。ファイルはインデクサの設計書の隣に置く
          - エラーメッセージ一覧: design/indexing/errors.md
  - 開発者向け:
      - design/index.md
      - はじめに:
          - 読む順番と 1 周の流れ: design/start/onboarding.md
          - 変更の種類から見る設計書を引く: design/start/review-map.md
      - 全体の構成:
          - ソースの分け方: design/structure/source.md
          - 配布物と開発用のフォルダ構成: design/structure/folders.md
          - データの置き場所とパスの決め方: design/structure/data.md
          - どの処理がどのファイルを読み書きするか: design/structure/io-files.md
          - 設定ファイル: design/structure/settings-file.md
          - プロセスとスレッド: design/structure/threads.md
          - クラスと関数の使い分け: design/structure/classes.md
      - インデックス作成:
          - design/indexing/index.md
          - インデックス作成のメインフロー: design/indexing/flow.md
          - クロール対象フォルダと取り込み対象: design/indexing/crawl.md
          - 取り込み対象の決定: design/indexing/target-decision.md
          - 取り込み一覧: design/indexing/ingest-list.md
          - 取り込みの並列化: design/indexing/parallel.md
          - Excel: design/indexing/excel.md
          - Word: design/indexing/word.md
          - PowerPoint: design/indexing/powerpoint.md
          - Word・PowerPoint の共通処理と Office アプリの管理: design/indexing/office-apps.md
          - エラーメッセージ一覧: design/indexing/errors.md
          - 既知の問題: design/indexing/known-issues.md
      - インデックスのデータ:
          - インデックスのファイルの形: design/index-data/format.md
          - 入れ替えと書き出し: design/index-data/publish.md
          - システムインデックス: design/index-data/system-index.md
      - 検索:
          - design/search/index.md
          - 検索を速くする仕組み: design/search/speed.md
          - 高速検索（Windows Search）: design/search/fast-search.md
          - 検索結果ファイル: design/search/output.md
      - 画面:
          - design/gui/index.md
          - 状態と操作の流れ: design/gui/state-flow.md
          - 画面の共通の決まり: design/gui/common.md
          - 画面に出すメッセージの一覧: design/gui/messages.md
          - インデックス一覧の管理: design/gui/index-tab.md
          - インデックス作成の実行: design/gui/indexing-run.md
          - 検索タブ: design/gui/search-tab.md
          - 元のファイルを開く: design/gui/open-file.md
          - 選択行のプレビュー: design/gui/preview.md
          - 検索対象のツリー: design/gui/search-tree.md
          - ［8 設定］タブ: design/gui/settings-tab.md
          - ［9 プロセス停止］タブ: design/gui/process-tab.md
          - 画面の実装構成: design/gui/implementation.md
          - 画面を固まらせない待たせ方: design/gui/responsiveness.md
      - 開発の進め方:
          - design/testing/index.md
          - テストの実行: design/testing/run.md
          - CI: design/testing/ci.md
          - 性能とリソースの計測のしかた: design/testing/perf.md
          - 速さの回帰テストと上限の決め方: design/testing/perf-check.md
          - コミット前に動く検査: design/testing/pre-commit.md
          - 単体テスト（インデックスと検索）: design/testing/unit-index.md
          - 単体テスト（インデックス作成）: design/testing/unit-indexer.md
          - 単体テスト（Office）: design/testing/unit-office.md
          - 単体テスト（検査と道具）: design/testing/unit-checks.md
          - 画面のテストと確認: design/testing/gui-tests.md
          - 貢献のしかた: https://github.com/hsgwa/tebunko/blob/main/.github/CONTRIBUTING.ja.md
      - 関数一覧:
          - design/reference/index.md
          - 部品ごとの関数（設定・ファイル）: design/reference/settings.md
          - 部品ごとの関数（インデックス作成）: design/reference/indexer.md
          - 部品ごとの関数（TSV と本文インデックス）: design/reference/tsv.md
          - 部品ごとの関数（検索・スレッド・元のファイル・画面）: design/reference/search.md
