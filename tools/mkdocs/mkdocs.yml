# 設計書（docs/）を MkDocs で HTML のサイトにする設定。
#
# リポジトリの直下で実行する（privacy プラグインの cache_dir は実行した場所から数えるため）。
#
#   pip install --require-hashes -r tools/mkdocs/requirements.txt
#   mkdocs serve -f tools/mkdocs/mkdocs.yml             手元で見る（http://127.0.0.1:8000/）
#   mkdocs build --strict -f tools/mkdocs/mkdocs.yml    work/site/ に書き出す（CI と同じ。リンク切れ・アンカー切れで失敗する）
#
# docs_dir・site_dir・hooks のパスは、このファイルのある場所から数える。
# docs/ の Markdown は GitHub でもそのまま読めるように書いたものを変えずに使う。
# GitHub との違いは hooks.py で埋める（先頭ページ・docs/ の外へのリンク）。
# 公開は .github/workflows/docs.yml が main の更新ごとに GitHub Pages へ行う。
site_name: tebunko 設計書
site_url: https://hsgwa.github.io/tebunko/
site_description: Office ファイルを中身の文字で一括検索する Windows 用ツール tebunko の設計書
repo_url: https://github.com/hsgwa/tebunko
repo_name: hsgwa/tebunko
edit_uri: edit/main/docs/
copyright: Copyright (c) 2026 hsgwa / MIT License

docs_dir: ../../docs
# 生成物は work/ に置く（.gitignore 済み）
site_dir: ../../work/site

hooks:
  - hooks.py

theme:
  name: material
  language: ja
  logo: images/logo.svg
  favicon: images/logo.svg
  # Google Fonts を使わず、閲覧者の OS のフォントで表示する（既定の Roboto は日本語を含まないため見た目もほぼ変わらない）
  font: false
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: ダークモードにする
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: ライトモードにする

plugins:
  - search:
      lang: ja
  # 外部のサーバー（unpkg など）から読み込むものを、ビルドのときに取り込んで自前で配信する。
  # 閲覧者のブラウザーが第三者のサーバーへ通信しないようにする（本ツールは通信をしないことを前提にしている）
  - privacy:
      # 取り込んだファイルの置き場所（work/ は git の管理外）
      cache_dir: work/cache/privacy

# Material テーマは Mermaid を unpkg から読み込む。先にここで読み込ませると、テーマは読み込みを省く。
# 外部の URL は privacy プラグインがビルドのときに取り込むため、閲覧者は unpkg へ通信しない。
# 版は Material テーマが読み込む版（mermaid@11）に合わせて固定する
extra_javascript:
  - https://unpkg.com/mermaid@11.17.2/dist/mermaid.min.js

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      # 見出しのアンカーを GitHub と同じ形にする（日本語を残し、記号を除き、英字を小文字にする）。
      # docs/ の中のリンクは GitHub の形のアンカーで書いている
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # ```mermaid のブロックを図として描く
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# 並びと階層は docs/00_index.md の「ドキュメント構成」に合わせる
nav:
  - 概要: 00_index.md
  - 共通:
      - フォルダ構成と設定ファイル: 00_共通_1_フォルダ構成と設定ファイル.md
      - 共通モジュール: 00_共通_2_共通モジュール.md
      - TSV・検索・画面の関数: 00_共通_2_共通モジュール_1_TSV・検索・画面の関数.md
      - テスト: 00_共通_3_テスト.md
  - インデックス作成:
      - 01_インデックス作成.md
      - Excel: 01_インデックス作成_1_Excel.md
      - Word: 01_インデックス作成_2_Word.md
      - PowerPoint: 01_インデックス作成_3_PowerPoint.md
      - メインフローと取り込み一覧: 01_インデックス作成_4_メインフローと取り込み一覧.md
      - クロール: 01_インデックス作成_5_クロール.md
      - 共通処理とアプリ管理: 01_インデックス作成_6_共通処理とアプリ管理.md
      - 出力 TSV と既知の問題: 01_インデックス作成_7_出力TSVと既知の問題.md
      - エラーメッセージ一覧: 01_インデックス作成_8_エラーメッセージ一覧.md
  - 検索: 02_検索.md
  - 画面:
      - 03_画面.md
      - インデックス管理タブ: 03_画面_1_インデックス管理タブ.md
      - 検索タブ: 03_画面_2_検索タブ.md
      - 元のファイルを開く: 03_画面_2_検索タブ_1_元のファイルを開く.md
      - プロセス停止タブ: 03_画面_3_プロセス停止タブ.md
      - 状態と操作の流れ: 03_画面_4_状態と操作の流れ.md
      - 共通仕様: 03_画面_5_共通仕様.md
      - 実装とテスト: 03_画面_6_実装とテスト.md
      - 画面のテスト: 03_画面_6_実装とテスト_1_テスト.md
  - 安全性: 04_安全性.md
  - 制限モード: 05_制限モード.md
