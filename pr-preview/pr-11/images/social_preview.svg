<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub のソーシャルプレビュー（Settings → Social preview）の元図。PNG は social_preview.png -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <g font-family="'Segoe UI', 'Yu Gothic UI', 'Meiryo', sans-serif">
    <g transform="translate(96 150)">
      <rect width="200" height="200" rx="44" fill="url(#icon)"/>
      <circle cx="86" cy="80" r="41" fill="none" stroke="#FFFFFF" stroke-width="14"/>
      <line x1="117" y1="111" x2="155" y2="149" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
      <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round">
        <line x1="64" y1="67" x2="110" y2="67"/>
        <line x1="64" y1="81" x2="104" y2="81"/>
        <line x1="64" y1="95" x2="92" y2="95"/>
      </g>
    </g>
    <text x="350" y="230" fill="#FFFFFF" font-size="96" font-weight="700" letter-spacing="-1">tebunko</text>
    <text x="354" y="300" fill="#BFD3FE" font-size="40" font-weight="600">Office ファイルを、中身の文字で横断検索</text>
    <text x="354" y="352" fill="#94A3B8" font-size="28">Excel ・ Word ・ PowerPoint ／ Windows 用</text>
    <g font-size="24" font-weight="600" fill="#E2E8F0">
      <rect x="96" y="470" width="220" height="52" rx="26" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="206" y="504" text-anchor="middle">インストール不要</text>
      <rect x="336" y="470" width="220" height="52" rx="26" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="446" y="504" text-anchor="middle">管理者権限なし</text>
      <rect x="576" y="470" width="220" height="52" rx="26" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="686" y="504" text-anchor="middle">通信しない</text>
      <rect x="816" y="470" width="220" height="52" rx="26" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="926" y="504" text-anchor="middle">MIT ライセンス</text>
    </g>
  </g>
</svg>
