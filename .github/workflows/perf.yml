# 性能とリソースを手動で測る（Office からの取り込み・インデックス作成・検索・入力しながらの検索を、それぞれ別のプロセスで）。結果はジョブの Summary と artifact に出力する。
# 数字は result.json と metrics.csv（1 行 1 指標。後で Grafana などに入れるため）にも書く。
#
# Actions の画面か `gh workflow run perf.yml -f ref=<ref> -f scale=0.1 -f ingest=200 -f typing=10 -f xlsx=5` で起動する。
# 計測スクリプト（tools/measure_perf.ps1）はこのワークフローの ref から、計測対象のコードは入力の ref からチェックアウトする（作業中のブランチも測れる）。
# データ（場所ごとの TSV）は、tebunko-perfdata の new_index.ps1 で毎回生成する。
# 取り込み（入力 ingest が 0 でないとき）は、Office を使わずに読む .docx・.pptx だけを測る（テストデータの複製を new_ingest_data.ps1 で作る）。
# ランナーには Office が無いので、Excel・Word・PowerPoint を使う取り込み（.xlsx・.doc・.ppt）は測らない。
# Excel の流れ読み（入力 xlsx が 0 でないとき）は、ブックをその場で ZIP から組み立て（Office は使わない）、readXlsxObjectUnits の時間を測る。直す前と後の ref を、同じ形で測って比べる。
# 検索結果の書き出し（入力 export が 0 でないとき）は、合成のヒット 1 万件を Excel ブック・CSV・TSV に書き出す部分（invokeSearchExport）の時間を測る。直す前と後の ref を、同じ形で測って比べる。
# 入力しながらの検索（入力 typing が 0 でないとき）は、語を typing_min_length 文字目から 1 文字ずつ、決まった間隔で検索の司令のスレッドへ送って測る。
# 前と後の比べ（入力 base_ref が空でないとき）は、base_ref を base のフォルダにもチェックアウトし、今の「計測する」の代わりに tools/perf/measure_compare.ps1 で、
# 同じジョブの中で前と後の検索を rounds 組、交互に測る（取り込み・Excel・書き出し・入力しながらの検索は測らない）。結果は compare.md・compare.json。
# 散らばる語（入力 scattered が 1 のとき）は、場所ごとに 1 件ずつ散らばる語のデータ（19 ファイル × 500 場所。9,500 件）を tools/perf/new_scattered_data.ps1 で別の置き場に作って測り、
# PSCustomObject 1 万件を作る時間（tools/perf/measure_hit_objects.ps1。結果は hit_objects.md・hit_objects.json）も測る。base_ref が空なら、散らばる語は ref だけを 1 回測る。
#   gh workflow run perf.yml -f ref=<後の ref> -f base_ref=<前の ref> -f scale=0.04 -f count=5 -f rounds=5 -f scattered=1
# ref・base_ref にコミットを渡すときは 40 桁で書く（短い番号は actions/checkout で取れず、チェックアウトの段で止まる）。ブランチ・タグはそのまま書ける。
# ランナーは手元の PC と条件が違う（コア数、Defender の設定）。比べるときは、このワークフローで測った数字どうしで比べる。
# run の中は ASCII だけで書く（Windows PowerShell 5.1 は BOM の無いスクリプトを ANSI として読むため。日本語は計測スクリプトの側で出力する）。
name: perf

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 測る ref（ブランチ・タグ・コミット。コミットは 40 桁で書く。短い番号はチェックアウトで取れない）
        required: true
        default: main
      scale:
        description: データの量（1 でブック 5.4 万・TSV 16 万・約 1GB。0.04 は入力しながらの検索の 7,000 件規模）
        type: choice
        options: ["0.04", "0.1", "0.3", "1"]
        default: "0.1"
      count:
        description: 語ごとに続けて検索する回数（最小・中央値・平均・最大を出す）
        default: "20"
      ingest:
        description: 取り込みを測る .docx・.pptx のそれぞれの数（0 は取り込みを測らない）
        type: choice
        options: ["0", "200", "1000"]
        default: "0"
      xlsx:
        description: Excel のブックを ZIP から読む部分（Office を使わない。シートの流れ読み）を測る、普通のブックを読む回数（0 は測らない）。同じシートの部品を指す <sheet> を 200 個並べたブックも 1 回読む
        type: choice
        options: ["0", "5"]
        default: "0"
      export:
        description: 検索結果をファイルに書き出す部分（Excel ブック・CSV・TSV。合成のヒット 1 万件）を測る、形式ごとの書き出しの回数（0 は測らない）
        type: choice
        options: ["0", "3"]
        default: "0"
      typing:
        description: 入力しながらの検索を測る、語ごとの入力の繰り返し回数（0 は測らない）
        type: choice
        options: ["0", "10", "20"]
        default: "0"
      typing_min_length:
        description: 入力しながらの検索で最初に送る語の長さ（3 が画面と同じで合否を決める。1 は短い語の取り消しを多く含む厳しめの参考値）
        type: choice
        options: ["3", "1"]
        default: "3"
      base_ref:
        description: 比べる前の ref（空なら ref だけを今までどおり測る。指定すると、同じジョブの中で前と後の検索を交互に測る。取り込み・Excel・書き出し・入力しながらの検索は測らない。コミットは 40 桁で書く）
        required: false
        default: ""
      rounds:
        description: base_ref があるとき、前 → 後 を交互に測る組の数
        type: choice
        options: ["3", "5"]
        default: "5"
      scattered:
        description: 場所ごとに 1 件ずつ散らばる語（9,500 件）のデータも作って測り、PSCustomObject 1 万件を作る時間も測る（1 で測る）
        type: choice
        options: ["0", "1"]
        default: "0"

permissions:
  contents: read

# 同じ ref（と同じ前の ref）で続けて起動したときは、前の実行を取り消さず、終わるのを待つ。前と後の組が違う起動は互いに待たせない
concurrency:
  group: perf-${{ inputs.ref }}-${{ inputs.base_ref }}
  cancel-in-progress: false

env:
  # データ生成スクリプトのリポジトリ（https://github.com/hsgwa/tebunko-perfdata）のコミット。更新するときは手で書き換える
  PERFDATA_SHA: e334e6b5ecfe752bad9822ed143561be2134bb15

jobs:
  perf:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 計測スクリプトをチェックアウトする
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false

      - name: 計測対象のコードをチェックアウトする
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false

      - name: 前の ref の計測対象のコードをチェックアウトする
        if: ${{ inputs.base_ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false

      - name: データ生成スクリプトをチェックアウトする
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hsgwa/tebunko-perfdata
          ref: ${{ env.PERFDATA_SHA }}
          path: perfdata
          persist-credentials: false

      - name: データを生成する
        shell: powershell
        env:
          SCALE: ${{ inputs.scale }}
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "perf"
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          & .\perfdata\tools\new_index.ps1 -Dest (Join-Path $work "store\content\perfdata") -Scale ([double]::Parse($env:SCALE, [System.Globalization.CultureInfo]::InvariantCulture))
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          [System.IO.File]::WriteAllText((Join-Path $work "data_seconds.txt"), $watch.Elapsed.TotalSeconds.ToString([System.Globalization.CultureInfo]::InvariantCulture))

      - name: 取り込みのデータを生成する
        if: ${{ inputs.ingest != '0' && inputs.base_ref == '' }}
        shell: powershell
        env:
          INGEST: ${{ inputs.ingest }}
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "perf"
          & .\tool\tools\perf\new_ingest_data.ps1 -Dest (Join-Path $work "office") -Source .\tool\tests\testdata\office -Docx ([int]$env:INGEST) -Pptx ([int]$env:INGEST)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 散らばる語のデータを生成する
        if: ${{ inputs.scattered == '1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "perf"
          & .\tool\tools\perf\new_scattered_data.ps1 -Dest (Join-Path $work "scattered\tsv") -Words (Join-Path $work "scattered\words.tsv")
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 計測する
        if: ${{ inputs.base_ref == '' }}
        shell: powershell
        env:
          INGEST: ${{ inputs.ingest }}
          XLSX: ${{ inputs.xlsx }}
          EXPORT: ${{ inputs.export }}
          REF: ${{ inputs.ref }}
          SCALE: ${{ inputs.scale }}
          COUNT: ${{ inputs.count }}
          TYPING: ${{ inputs.typing }}
          TYPING_MIN_LENGTH: ${{ inputs.typing_min_length }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "perf"
          $sha = git -C target rev-parse HEAD
          $short = $sha.Substring(0, 7)
          $data = [double]::Parse([System.IO.File]::ReadAllText((Join-Path $work "data_seconds.txt")), [System.Globalization.CultureInfo]::InvariantCulture)
          $office = @{}
          if ($env:INGEST -ne "0") { $office.Office = Join-Path $work "office" }
          $xlsx = @{}
          if ($env:XLSX -ne "0") { $xlsx.Xlsx = [int]$env:XLSX }
          $export = @{}
          if ($env:EXPORT -ne "0") { $export.Export = [int]$env:EXPORT }
          $typing = @{}
          if ($env:TYPING -ne "0") { $typing.Typing = [int]$env:TYPING; $typing.TypingMinLength = [int]$env:TYPING_MIN_LENGTH }
          & .\tool\tools\measure_perf.ps1 @office @xlsx @export @typing -Index (Join-Path $work "store\content\perfdata") -Work $work -Tool target -Words perfdata\words.tsv -Count ([int]$env:COUNT) -Label "$env:REF ($short) scale $env:SCALE" -RunId $env:RUN_ID -Ref $env:REF -Sha $sha -Scale $env:SCALE -DataSeconds $data -Out (Join-Path $work "result")

      - name: 前と後を比べて測る
        if: ${{ inputs.base_ref != '' || inputs.scattered == '1' }}
        shell: powershell
        env:
          BASE_REF: ${{ inputs.base_ref }}
          REF: ${{ inputs.ref }}
          ROUNDS: ${{ inputs.rounds }}
          SCATTERED: ${{ inputs.scattered }}
          SCALE: ${{ inputs.scale }}
          COUNT: ${{ inputs.count }}
          RUN_ID: ${{ github.run_id }}
          INGEST: ${{ inputs.ingest }}
          XLSX: ${{ inputs.xlsx }}
          EXPORT: ${{ inputs.export }}
          TYPING: ${{ inputs.typing }}
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "perf"
          if ($env:BASE_REF -ne "") {
            foreach ($name in @("INGEST", "XLSX", "EXPORT", "TYPING")) {
              if ((Get-Item "env:$name").Value -ne "0") { Write-Warning "base_ref is set: input $($name.ToLower()) is ignored (the comparison measures search only)." }
            }
          }
          $sides = @{ TargetTool = "target"; TargetRef = $env:REF; Rounds = 1 }
          if ($env:BASE_REF -ne "") {
            $sides.BaseTool = "base"; $sides.BaseRef = $env:BASE_REF; $sides.Rounds = [int]$env:ROUNDS
            $sides.PerfdataIndex = Join-Path $work "store\content\perfdata"; $sides.PerfdataWords = "perfdata\words.tsv"
          }
          if ($env:SCATTERED -eq "1") { $sides.ScatteredIndex = Join-Path $work "scattered\tsv"; $sides.ScatteredWords = Join-Path $work "scattered\words.tsv" }
          & .\tool\tools\perf\measure_compare.ps1 @sides -Count ([int]$env:COUNT) -RunId $env:RUN_ID -Scale $env:SCALE -Work (Join-Path $work "compare") -Out (Join-Path $work "result")

      - name: PSCustomObject 1 万件を作る時間を測る
        if: ${{ inputs.scattered == '1' }}
        shell: powershell
        env:
          COUNT: ${{ inputs.count }}
        run: |
          $ErrorActionPreference = "Stop"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tool\tools\perf\measure_hit_objects.ps1 -Hits 10000 -Repeat ([int]$env:COUNT) -Out (Join-Path $env:RUNNER_TEMP "perf\result")
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 結果を Summary に書き出す
        if: always()
        shell: powershell
        run: |
          $summary = Join-Path $env:RUNNER_TEMP "perf\result\summary.md"
          if (Test-Path -LiteralPath $summary) {
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, [System.IO.File]::ReadAllText($summary, [System.Text.Encoding]::UTF8), (New-Object System.Text.UTF8Encoding($false)))
          }
          foreach ($name in @("compare.md", "hit_objects.md")) {
            $part = Join-Path $env:RUNNER_TEMP "perf\result\$name"
            if (Test-Path -LiteralPath $part) {
              [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "`n" + [System.IO.File]::ReadAllText($part, [System.Text.Encoding]::UTF8), (New-Object System.Text.UTF8Encoding($false)))
            }
          }

      - name: 結果を artifact にアップロードする
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ github.run_id }}
          path: ${{ runner.temp }}/perf/result
          retention-days: 90
          if-no-files-found: ignore
