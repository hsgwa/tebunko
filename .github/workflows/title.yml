# PR と Issue のタイトルが Conventional Commits の形（feat: ... など）かを確かめる（tools/check_commit_message.ps1。AGENTS.md「GitHub の運用」）。
#
# - PR … squash merge では PR のタイトルが main のコミットのタイトルになる。形が違えば失敗にし、マージを止める（ブランチ保護の必須のチェック）。
#         必須のチェックは head のコミットごとに要るため、push（synchronize）でも動かす
# - Issue … 作成は止められないため、形が違えば直し方を 1 回だけコメントする
#
# タイトルは誰でも書ける信頼できない入力のため、式で run に埋め込まず環境変数で渡す。
# スクリプトは PowerShell 7 でも動くように書いてあるため、起動の速い ubuntu のランナーで pwsh を使う
name: title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: PR のタイトル
        shell: pwsh
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./tools/check_commit_message.ps1 -Title $env:TITLE

      - name: 見本（tests/testdata/compat/）の変更
        shell: pwsh
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./tools/check_compat_golden.ps1 -Title $env:TITLE -Base $env:BASE_SHA

  # 結果を PR のコメントに書く（docs/design/testing/ci.md「結果を PR のコメントに書く」）。
  # フォークの PR では書けないことがあるが、ジョブは失敗にしない（結果は Summary に残る）
  pr-comment:
    needs: [pr-title]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 既定のブランチの内容を取り出す（PR のコードは使わない）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/pr_checks_comment.ps1
            .github/actions/pr-comment/
          sparse-checkout-cone-mode: false

      - name: 結果を書く
        uses: ./.github/actions/pr-comment
        with:
          workflow-key: title
          result: ${{ needs['pr-title'].result }}

  issue-title:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Issue のタイトル
        id: check
        continue-on-error: true
        shell: pwsh
        env:
          TITLE: ${{ github.event.issue.title }}
        run: ./tools/check_commit_message.ps1 -Title $env:TITLE

      # 同じ Issue に何度もコメントしないよう、目印（.github/title_comment.md の 1 行目）が付いたコメントがあれば書かない
      - name: 直し方をコメントする
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          marker=$(head -n 1 .github/title_comment.md)
          found=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq "[.comments[].body | select(startswith(\"$marker\"))] | length")
          if [ "$found" = "0" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file .github/title_comment.md
          fi
