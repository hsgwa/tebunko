# 配布物の公開（GitHub Actions）
#
# v で始まるタグを push すると、テストを通したうえで配布 zip を作り、GitHub Release に載せる。
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# zip の中身はツール本体（tebunko.bat・scripts\）と README.md・LICENSE だけにする。
# 改ざんの確認用のカタログ（tebunko.cat）・ハッシュ一覧（SHA256SUMS.txt）と部品表（sbom.cdx.json）は、zip と並べてリリースに載せる（docs\04_安全性.md 5.1）。
# SECURITY は zip に入れず、README とリリースの説明からリンクする。
# zip 自体の SHA256 はリリースの説明に書く（VirusTotal での照会用。docs\04_安全性.md 5.6）。
# zip のビルドの来歴（どのコミットから、どのワークフローで作ったか）を Sigstore で署名し、GitHub に登録する。
# 署名の bundle（tebunko_grep-<タグ>.zip.sigstore.json）もリリースに載せる（docs\04_安全性.md 5.1。OpenSSF Scorecard の Signed-Releases）。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      # Release を作るため
      contents: write
      # 来歴の署名（Sigstore の証明書を OIDC のトークンで受け取る）と、GitHub への登録のため
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配布物を作る
        shell: powershell
        run: .\tools\new_release_package.ps1 -Version $env:GITHUB_REF_NAME

      - name: 配布物の来歴に署名する
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: work/release/tebunko_grep-${{ github.ref_name }}.zip

      # pwsh（PowerShell 7）で動かす。ランナーは run の内容を BOM なしの UTF-8 のファイルにして実行するが、
      # Windows PowerShell 5.1 は BOM の無いスクリプトを ANSI として読むため、説明に書く日本語が化ける
      - name: GitHub Release に公開
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $zip = "work\release\tebunko_grep-$env:GITHUB_REF_NAME.zip"
          $bundle = "$zip.sigstore.json"
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination $bundle
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          $repo = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_REF_NAME"
          $notes = @(
            "使い方: [README]($repo/README.md)"
            ""
            "安全性・脆弱性の連絡先: [SECURITY]($repo/.github/SECURITY.ja.md)"
            ""
            "配布 zip の SHA256: ``$hash``"
            ""
            "来歴の確認: ``gh attestation verify tebunko_grep-$env:GITHUB_REF_NAME.zip -R $env:GITHUB_REPOSITORY``"
            ""
            "改ざんの確認（zip を展開したフォルダで、ダウンロードした tebunko.cat を指定する）: ``Test-FileCatalog -Path .\scripts, .\tebunko.bat -CatalogFilePath <tebunko.cat> -Detailed``"
          ) -join "`n"
          gh release create $env:GITHUB_REF_NAME $zip $bundle "work\release\tebunko.cat" "work\release\SHA256SUMS.txt" "work\release\sbom.cdx.json" --title $env:GITHUB_REF_NAME --notes $notes --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
