# テストの自動実行（GitHub Actions）
#
# Windows PowerShell 5.1 は windows ランナーに最初から入っている。ランナーには Pester 5 も入っているが、テストは 3.4 の書き方のため
# 3 系を使う（無ければ入れる。tests\run.ps1 が 3 系を明示して読み込む）。
# ランナーに Office は入っていないため、Office が要るテスト（タグ Office）は tests\run.ps1 が既定で外す。
# release.yml からも呼ばれる（workflow_call）。タグの push では release.yml の中で実行するため、ここでは動かさない。
name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

# 同じブランチに続けて push したときは、古い実行を取り消す
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # コミットの作者を全履歴で調べるため
          fetch-depth: 0

      - name: 個人情報・文字コードの検査
        shell: powershell
        run: .\tools\check_commit.ps1

      - name: Pester 3.4 の用意
        shell: powershell
        run: |
          if (!(Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -eq 3 })) {
            Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Get-Module Pester -ListAvailable | Format-Table Name, Version, ModuleBase -AutoSize | Out-String | Write-Host

      - name: テスト（Unit・Io・Meta）
        shell: powershell
        run: .\tests\run.ps1 -Ci

      - name: 静的解析（PSScriptAnalyzer）
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          # TypeNotFound は、継承元の型が別ファイルにあるため 1 ファイルだけでは解決できないもの。
          # 読み込む順で解決できることは tests\meta\structure.Tests.ps1 の「型の読み込み」で確かめている
          $found = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error | Where-Object { $_.RuleName -ne "TypeNotFound" })
          $found | Format-Table -AutoSize | Out-String | Write-Host
          if ($found) { exit 1 }

      - name: テスト結果の保存
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: work/test/
