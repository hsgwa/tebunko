# テストの自動実行（GitHub Actions）
#
# Windows PowerShell 5.1 は windows ランナーに最初から入っている。ランナーには Pester 5 も入っているが、テストは 3.4 の書き方のため
# 3 系を使う（無ければ入れる。tests\run.ps1 が 3 系を明示して読み込む）。
# ランナーに Office は入っていないため、Office が要るテスト（タグ Office）は tests\run.ps1 が既定で外す。
# release.yml からも呼ばれる（workflow_call）。タグの push では release.yml の中で実行するため、ここでは動かさない。
# 作業ブランチは PR（pull_request）で確かめる。push でも動かすと、PR のブランチでは同じテストが 2 回走るため、push は main だけにする。
# main への push では、Codecov の比較元になる main のカバレッジを送る。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# 同じブランチに続けて push したときは、古い実行を取り消す
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # コミットの作者を全履歴で調べるため
          fetch-depth: 0
          # 後の手順は git の認証を使わないため、トークンを作業ツリーに残さない
          persist-credentials: false

      - name: 個人情報・文字コードの検査
        shell: powershell
        run: .\tools\check_commit.ps1

      # PR のコミットに作者の Signed-off-by があるか（AGENTS.md「GitHub の運用」）。
      # pull_request では PR をマージした形のコミットを取り出すため、1 つ目の親が main、2 つ目の親が PR の先頭になる。
      # その間だけを調べるので、main から取り込んだコミットと、決まりを作る前の履歴は調べない
      - name: Signed-off-by の検査
        if: github.event_name == 'pull_request'
        shell: powershell
        run: .\tools\check_signoff.ps1 -Range "HEAD^1..HEAD^2"

      - name: Pester 3.4 の用意
        shell: powershell
        run: |
          if (!(Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -eq 3 })) {
            Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Get-Module Pester -ListAvailable | Format-Table Name, Version, ModuleBase -AutoSize | Out-String | Write-Host

      - name: テスト（Unit・Io・Meta）
        shell: powershell
        run: .\tests\run.ps1 -Ci

      # 送るのは work\test\coverage.xml（リポジトリからの相対パスと行ごとの実行回数）だけ。
      # トークンはリポジトリの Secrets の CODECOV_TOKEN。fork からの PR ではトークンが無くても送れる。
      # 送れなくても CI は失敗にしない（下限の確認は tests\run.ps1 -Ci が行う）。
      # タグの push（release.yml から呼ばれたとき）では送らない。
      # Codecov の設定は .github/codecov.yml。判定（commit status）は参考表示だけにして PR を止めない。
      # Windows の Codecov CLI は codecov.yml を cp1252 で読むため、codecov.yml には ASCII の文字だけを書く（コメントも書かない）
      - name: カバレッジを Codecov に送る
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') && hashFiles('work/test/coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: work/test/coverage.xml
          disable_search: true
          codecov_yml_path: .github/codecov.yml
          fail_ci_if_error: false

      - name: 静的解析（PSScriptAnalyzer）
        shell: powershell
        # 版を固定する。新しい版でルールが増えると、コードを変えていなくても CI が落ちるため。
        # PowerShell のモジュールは Dependabot の対象外なので、上げるときはこの版を書き換え、指摘が 0 件のままか PR で確かめる。
        # ランナーに別の版が入っていることがあるため、読み込むときも版を指定する
        env:
          PSSA_VERSION: 1.25.0
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION
          # TypeNotFound は、継承元の型が別ファイルにあるため 1 ファイルだけでは解決できないもの。
          # 読み込む順で解決できることは tests\meta\structure.Tests.ps1 の「型の読み込み」で確かめている
          $found = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error | Where-Object { $_.RuleName -ne "TypeNotFound" })
          $found | Format-Table -AutoSize | Out-String | Write-Host
          if ($found) { exit 1 }

      - name: テスト結果の保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: work/test/
