# テストの自動実行（GitHub Actions）
#
# Windows PowerShell 5.1 は windows ランナーに最初から入っている。テストは Pester 5.9.0 で書く（tests\run.ps1 が版を指定して読み込む。
# ランナーに無ければ入れる）。
# ランナーに Office は入っていないため、Office が要るテスト（タグ Office）は tests\run.ps1 が既定で外す。
# release.yml からも呼ばれる（workflow_call）。タグの push では release.yml の中で実行するため、ここでは動かさない。
# 作業ブランチは PR（pull_request）で確かめる。push でも動かすと、PR のブランチでは同じテストが 2 回走るため、push は main だけにする。
# main への push では、Codecov の比較元になる main のカバレッジを送る。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# 同じブランチに続けて push したときは、古い実行を取り消す
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      # PSScriptAnalyzer の版を固定する。新しい版でルールが増えると、コードを変えていなくても CI が落ちるため。
      # PowerShell のモジュールは Dependabot の対象外なので、上げるときはこの 1 か所を書き換え、tools\check_analyzer.ps1 -UpdateBaseline でベースラインを直して PR で確かめる。
      PSSA_VERSION: 1.25.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # コミットの作者を全履歴で調べるため
          fetch-depth: 0
          # 後の手順は git の認証を使わないため、トークンを作業ツリーに残さない
          persist-credentials: false

      - name: 個人情報・文字コードの検査
        shell: powershell
        run: .\tools\check_commit.ps1

      # PR のコミットに作者の Signed-off-by があるか（AGENTS.md「GitHub の運用」）。
      # pull_request では PR をマージした形のコミットを取り出すため、1 つ目の親が main、2 つ目の親が PR の先頭になる。
      # その間だけを調べるので、main から取り込んだコミットと、決まりを作る前の履歴は調べない
      - name: Signed-off-by の検査
        if: github.event_name == 'pull_request'
        shell: powershell
        run: .\tools\check_signoff.ps1 -Range "HEAD^1..HEAD^2"

      - name: Pester の用意
        shell: powershell
        # 版は tests\run.ps1 の Import-Module と同じにする。Windows に最初から入っている 3.4 とは発行元が違うため -SkipPublisherCheck が要る
        env:
          PESTER_VERSION: 5.9.0
        run: |
          if (!(Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]$env:PESTER_VERSION })) {
            Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Get-Module Pester -ListAvailable | Format-Table Name, Version, ModuleBase -AutoSize | Out-String | Write-Host

      - name: PSScriptAnalyzer を入れる
        shell: powershell
        # 版はジョブの env（PSSA_VERSION）で固定している。
        # ランナーに別の版が入っていることがあるため、読み込むときも版を指定する（tests\meta\safety.Tests.ps1 と tools\check_analyzer.ps1 が PSSA_VERSION を読む）。
        # テストの前に入れるのは、テストの中の静的解析（safety.Tests.ps1）も固定した版で動かすため
        run: Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Force -Scope CurrentUser -SkipPublisherCheck

      - name: テスト（Unit・Io・Meta）
        shell: powershell
        run: .\tests\run.ps1 -Ci

      # 送るのは work\test\coverage.xml（リポジトリからの相対パスと行ごとの実行回数）だけ。
      # トークンはリポジトリの Secrets の CODECOV_TOKEN。fork からの PR ではトークンが無くても送れる。
      # 送れなくても CI は失敗にしない（下限の確認は tests\run.ps1 -Ci が行う）。
      # タグの push（release.yml から呼ばれたとき）では送らない。
      # Codecov の設定は .github/codecov.yml。判定（commit status）は参考表示だけにして PR を止めない。
      # Windows の Codecov CLI は codecov.yml を cp1252 で読むため、codecov.yml には ASCII の文字だけを書く（コメントも書かない）
      - name: カバレッジを Codecov に送る
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') && hashFiles('work/test/coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: work/test/coverage.xml
          disable_search: true
          codecov_yml_path: .github/codecov.yml
          fail_ci_if_error: false

      # 重大度 Error 以外も含む全規則と、5.1 に無い構文・コマンドを、ベースライン（tests\meta\PSScriptAnalyzer.baseline.tsv）と比べる。
      # 設定は tests\meta\PSScriptAnalyzer.psd1・PSScriptAnalyzer.tests.psd1。TypeNotFound は tools\check_analyzer.ps1 が除く。
      # shell: powershell の run は ASCII だけにする（#143）
      - name: 静的解析（PSScriptAnalyzer）
        shell: powershell
        run: .\tools\check_analyzer.ps1

      - name: テスト結果の保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: work/test/

  # 結果を PR のコメントに書く（docs/design/testing/ci.md「結果を PR のコメントに書く」）。
  # フォークの PR では書けないことがあるが、ジョブは失敗にしない（結果は Summary に残る）
  pr-comment:
    needs: [test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 既定のブランチの内容を取り出す（PR のコードは使わない）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/pr_checks_comment.ps1
            .github/actions/pr-comment/
          sparse-checkout-cone-mode: false

      - name: 結果を書く
        uses: ./.github/actions/pr-comment
        with:
          workflow-key: test
          result: ${{ needs.test.result }}
