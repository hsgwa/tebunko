# 画面のスモークテスト（GitHub Actions）
#
# 本物の画面（WPF）を別のプロセスで起動し、UI オートメーションで、画面遷移（画面遷移の一覧は docs/design/testing/gui-smoke.md）を確かめる
# （tests\gui\*.Tests.ps1。タグ Gui。共通の関数は tests\gui\gui_helpers.ps1）。
# test.yml には入れない。test.yml は release.yml から呼ばれ、release は test を待つため、画面のテストが不安定なときにリリースまで止まる。
# 別のワークフローにすれば test と並んで動き、test の時間も延びない。
# 必須チェックにはしない（必須チェックを変えるのは持ち主。しばらく安定して通ることを見てから諮る）。
# paths の絞り込みは付けない（あとで必須チェックにしたとき、文書だけの PR で pending のまま残らないように）。
# tests\run.ps1 -Ci は使わない。カバレッジの下限を確かめるが、画面は別のプロセスで動くので計測できず、Gui だけを流すと下限を割るため。
name: gui

on:
  push:
    branches: [main]
  pull_request:
  # 繰り返しの流し（gui-repeat）を手で呼ぶ。gui-smoke も一緒に動く
  workflow_dispatch:
    inputs:
      repeat:
        description: "流す回数の合計（5 本の shard に分ける。1〜50）"
        default: "50"
      paths:
        description: "流すテストのファイル（カンマ区切り）"
        default: 'tests\gui\smoke.Tests.ps1,tests\gui\index.Tests.ps1,tests\gui\index_archive.Tests.ps1,tests\tebunko\ui\startup_error.Tests.ps1'

# 同じブランチに続けて push したときは、古い実行を取り消す
concurrency:
  group: gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pester の用意
        shell: powershell
        # 版は tests\run.ps1 の Import-Module と同じにする（test.yml と同じ）
        env:
          PESTER_VERSION: 5.9.0
        run: |
          if (!(Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]$env:PESTER_VERSION })) {
            Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Get-Module Pester -ListAvailable | Format-Table Name, Version, ModuleBase -AutoSize | Out-String | Write-Host

      - name: 画面のスモークテスト
        shell: powershell
        run: .\tests\run.ps1 -Tag Gui

      # 失敗したときの画面の画像とエラーの記録（work\test\gui\）
      - name: 失敗の材料の保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-smoke-results
          path: work/test/gui/
          if-no-files-found: ignore

  # 結果を PR のコメントに書く（docs/design/testing/ci.md「結果を PR のコメントに書く」）。
  # フォークの PR では書けないことがあるが、ジョブは失敗にしない（結果は Summary に残る）
  pr-comment:
    needs: [gui-smoke]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 既定のブランチの内容を取り出す（PR のコードは使わない）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/pr_checks_comment.ps1
            .github/actions/pr-comment/
          sparse-checkout-cone-mode: false

      - name: 結果を書く
        uses: ./.github/actions/pr-comment
        with:
          workflow-key: gui
          result: ${{ needs['gui-smoke'].result }}

  # 画面のスモークテストを繰り返し流し、稀な落ち方（閉じても終わらない・起動失敗の記録の待ち切れ・終了コード 5）の率と原因を測る
  # （docs/design/testing/ci.md「gui.yml」）。
  # 1 shard が repeat / 5 回ずつ流す（全体 50 回は約 500 分で上限を超えるため分ける）。
  # 途中で落ちても続け、回ごとの結果と失敗の材料を残す。測っている間は push しない（concurrency で取り消されるため）
  gui-repeat:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      REPEAT_TOTAL: ${{ inputs.repeat || '50' }}
      REPEAT_PATHS: ${{ inputs.paths || 'tests\gui\smoke.Tests.ps1,tests\gui\index.Tests.ps1,tests\gui\index_archive.Tests.ps1,tests\tebunko\ui\startup_error.Tests.ps1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pester の用意
        shell: powershell
        env:
          PESTER_VERSION: 5.9.0
        run: |
          if (!(Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]$env:PESTER_VERSION })) {
            Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: 画面のスモークテストを繰り返す
        shell: powershell
        env:
          SHARD: ${{ matrix.shard }}
        run: .\tools\gui_repeat.ps1 -Shard $env:SHARD -Total $env:REPEAT_TOTAL -Paths $env:REPEAT_PATHS

      - name: 結果の保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-repeat-${{ matrix.shard }}
          path: repeat-results/
          if-no-files-found: ignore

  # 5 本の結果を集め、回数と落ちた場面の表を Summary に書く
  gui-repeat-summary:
    needs: [gui-repeat]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gui-repeat-*
          path: repeat-results
          merge-multiple: true

      - name: 表にまとめる
        shell: pwsh
        run: |
          $rows = @(Get-ChildItem repeat-results -Filter 'result-*.csv' -ErrorAction SilentlyContinue |
            ForEach-Object { Import-Csv $_.FullName -Header shard, n, code, kind, seconds })
          $lines = @("## gui-repeat（実行番号 $env:GITHUB_RUN_ID・試行 $env:GITHUB_RUN_ATTEMPT）", "", "流した回数: $($rows.Count)", "", "| 結果 | 回数 |", "|---|---|")
          foreach ($g in ($rows | Group-Object kind | Sort-Object Name)) { $lines += "| $($g.Name) | $($g.Count) |" }
          $lines += ""
          $lines += "| shard | 回 | 結果 | 秒 |"
          $lines += "|---|---|---|---|"
          foreach ($r in ($rows | Where-Object { $_.kind -ne '成功' })) { $lines += "| $($r.shard) | $($r.n) | $($r.kind) | $($r.seconds) |" }
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
