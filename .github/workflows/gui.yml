# 画面のスモークテスト（GitHub Actions）
#
# 本物の画面（WPF）を別のプロセスで起動し、UI オートメーションで、画面遷移（画面遷移の一覧は docs/design/testing/gui-smoke.md）を確かめる
# （tests\gui\*.Tests.ps1。タグ Gui。共通の関数は tests\gui\gui_helpers.ps1）。
# test.yml には入れない。test.yml は release.yml から呼ばれ、release は test を待つため、画面のテストが不安定なときにリリースまで止まる。
# 別のワークフローにすれば test と並んで動き、test の時間も延びない。
# 必須チェックにはしない（必須チェックを変えるのは持ち主。しばらく安定して通ることを見てから諮る）。
# paths の絞り込みは付けない（あとで必須チェックにしたとき、文書だけの PR で pending のまま残らないように）。
# tests\run.ps1 -Ci は使わない。カバレッジの下限を確かめるが、画面は別のプロセスで動くので計測できず、Gui だけを流すと下限を割るため。
name: gui

on:
  push:
    branches: [main]
  pull_request:
  # 手で動かしたときだけ、gui-smoke-repeat が同じテストを repeat 本並べて流す（たまにしか出ない失敗の率を測る）
  workflow_dispatch:
    inputs:
      repeat:
        description: 並べるジョブの数（既定 10、上限 20）
        type: number
        default: 10
      path:
        description: 流すテストのファイル（tests/gui/index.Tests.ps1 など。空なら全部）
        type: string
        default: ""

# 同じブランチに続けて push したときは、古い実行を取り消す
concurrency:
  group: gui-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pester の用意
        shell: powershell
        # 版は tests\run.ps1 の Import-Module と同じにする（test.yml と同じ）
        env:
          PESTER_VERSION: 5.9.0
        run: |
          if (!(Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]$env:PESTER_VERSION })) {
            Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Get-Module Pester -ListAvailable | Format-Table Name, Version, ModuleBase -AutoSize | Out-String | Write-Host

      - name: 画面のスモークテスト
        shell: powershell
        run: .\tests\run.ps1 -Tag Gui

      # 失敗したときの画面の画像とエラーの記録（work\test\gui\）
      - name: 失敗の材料の保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-smoke-results
          path: work/test/gui/
          if-no-files-found: ignore

  # 繰り返して流す口の準備: 並べる番号の一覧（1..repeat。上限 20）を作る
  repeat-plan:
    # 一時的な変更（調査が終わったら戻す）: pull_request でも 20 本並べる
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      numbers: ${{ steps.plan.outputs.numbers }}
    steps:
      - id: plan
        env:
          REPEAT: ${{ inputs.repeat || 20 }}
        run: |
          n="${REPEAT%%.*}"
          case "$n" in ''|*[!0-9]*) n=10 ;; esac
          if [ "$n" -lt 1 ]; then n=1; fi
          if [ "$n" -gt 20 ]; then n=20; fi
          echo "numbers=$(seq -s, 1 "$n" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  gui-smoke-repeat:
    needs: repeat-plan
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.repeat-plan.outputs.numbers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pester の用意
        shell: powershell
        env:
          PESTER_VERSION: 5.9.0
        run: |
          if (!(Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]$env:PESTER_VERSION })) {
            Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: 画面のスモークテスト（繰り返しの 1 本）
        shell: powershell
        env:
          TEST_PATH: ${{ inputs.path || 'tests/gui/zz_bisect.Tests.ps1' }}
          TEBUNKO_BISECT: '1'
        run: |
          if ($env:TEST_PATH) { .\tests\run.ps1 -Tag Gui -Path $env:TEST_PATH } else { .\tests\run.ps1 -Tag Gui }

      - name: 失敗の材料の保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-smoke-results-${{ matrix.number }}
          path: work/test/gui/
          if-no-files-found: ignore

  # 結果を PR のコメントに書く（docs/design/testing/ci.md「結果を PR のコメントに書く」）。
  # フォークの PR では書けないことがあるが、ジョブは失敗にしない（結果は Summary に残る）
  pr-comment:
    needs: [gui-smoke]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 既定のブランチの内容を取り出す（PR のコードは使わない）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/pr_checks_comment.ps1
            .github/actions/pr-comment/
          sparse-checkout-cone-mode: false

      - name: 結果を書く
        uses: ./.github/actions/pr-comment
        with:
          workflow-key: gui
          result: ${{ needs['gui-smoke'].result }}
