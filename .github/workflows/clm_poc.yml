# 本物の制限言語モード（CLM）で、制限モードに使う部品が動くかを確かめる（Issue #71 の作業 1 の試作）
#
# 使い捨ての Windows の実行環境に、WDAC または AppLocker のポリシーを当ててから、新しい powershell.exe で
# tools\clm_poc\probe.ps1 を動かす。結果はジョブの概要（Summary）に表で出る。
# cmd の手順は一時ファイルの文字コードで日本語が化けるおそれがあるため、run の中は ASCII だけにする。
# ポリシーを当てた後は、手順の shell を cmd にする（shell: powershell は一時フォルダの ps1 を動かすため、それ自体が CLM になる）。
name: clm-poc

on:
  push:
    branches: [worktree-clm-poc]
    paths:
      - '.github/workflows/clm_poc.yml'
      - 'tools/clm_poc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - control: wdac
            os: windows-2025
          - control: wdac
            os: windows-2022
          - control: applocker
            os: windows-2025
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.control }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ポリシーを当てる前（比べるため）
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\clm_poc\probe.ps1 -Root "%GITHUB_WORKSPACE%" -Label "before ${{ matrix.control }} ${{ matrix.os }}"

      - name: ポリシーを当てる
        shell: powershell
        run: .\tools\clm_poc\enable_${{ matrix.control }}.ps1

      - name: 当てた後の言語モード（-Command の対話セッション）
        shell: cmd
        run: powershell -NoProfile -Command "$ExecutionContext.SessionState.LanguageMode"

      - name: 当てた後（リポジトリの場所から -File で起動）
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\clm_poc\probe.ps1 -Root "%GITHUB_WORKSPACE%" -Label "after ${{ matrix.control }} ${{ matrix.os }} (repository)"

      # 許可したフォルダに置いたスクリプトが FullLanguage になるか（管理者が「ツールのフォルダを許可」したときにあたる）
      # Windows Server 2025 では、許可したフォルダのスクリプトを -File で起動すると
      # 「異なる言語モードで定義されたものは dot-source できない」で止まった。-Command の & で起動したときと比べる
      - name: 当てた後（許可したフォルダから -File で起動）
        continue-on-error: true
        shell: cmd
        run: |
          xcopy /e /i /q "%GITHUB_WORKSPACE%\tools\clm_poc" "C:\Program Files\clm_probe\tools\clm_poc" >nul
          powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\clm_probe\tools\clm_poc\probe.ps1" -Root "%GITHUB_WORKSPACE%" -Label "after ${{ matrix.control }} ${{ matrix.os }} (allowed folder, -File)"

      - name: 当てた後（許可したフォルダから -Command の & で起動）
        continue-on-error: true
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command "& 'C:\Program Files\clm_probe\tools\clm_poc\probe.ps1' -Root '%GITHUB_WORKSPACE%' -Label 'after ${{ matrix.control }} ${{ matrix.os }} (allowed folder, -Command)'"
