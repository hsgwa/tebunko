# 設計書のサイト（MkDocs）を作り、GitHub Pages に公開する（GitHub Actions）
#
# docs/ か MkDocs の設定を変えた PR では、サイトを作れること（リンク切れ・アンカー切れが無いこと）だけを確かめる。
# main が更新されたら、作ったサイトを GitHub Pages（https://hsgwa.github.io/tebunko/）に公開する。
# 使うパッケージは tools/mkdocs/requirements.txt でハッシュごと固定する（Scorecard の Pinned-Dependencies）。
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/mkdocs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/mkdocs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# 公開は 1 つずつ行う。公開の途中では取り消さない
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: MkDocs の用意
        run: pip install --require-hashes -r tools/mkdocs/requirements.txt

      - name: サイトを作る
        run: mkdocs build --strict

      - name: 公開するサイトの保存
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: work/site

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: GitHub Pages に公開
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
