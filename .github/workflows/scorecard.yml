# サプライチェーンの安全性の自己診断（OpenSSF Scorecard）
#
# ブランチ保護・依存の固定・危険なワークフローの有無などを OpenSSF Scorecard で採点し、
# 結果を GitHub の Security タブ（Code scanning）と、公開の結果ページ（README のバッジ）に載せる。
# 採点するだけで、main へのマージは止めない。
#
# publish_results で結果を公開するため、このワークフローには次の制約がある（Scorecard の決まり）。
#   - ジョブに run の手順を置かない（uses だけにする）
#   - 権限は id-token（結果の署名）と security-events（Code scanning への登録）だけを足す
name: scorecard

on:
  # ブランチ保護の設定が変わったとき（採点の項目 Branch-Protection のため）
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 採点
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 結果の保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5

      - name: Code scanning への登録
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
