# ワークフローの静的解析（CodeQL）
#
# GitHub Actions のワークフロー（.github/workflows/）を CodeQL で解析し、結果を GitHub の Security タブ（Code scanning）に載せる。
# 信頼できない入力（PR のタイトル・ブランチ名など）をそのまま run に埋め込む、権限が広すぎる、といった書き方を見つける。
# PowerShell は CodeQL の対象外のため、スクリプトの静的解析は test.yml の PSScriptAnalyzer が受け持つ。
# OpenSSF Scorecard の SAST は、PR のコミットが CodeQL で解析されているかを見る。
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

# 同じブランチに続けて push したときは、古い実行を取り消す
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # Code scanning への登録のため
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL の用意
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: actions
          build-mode: none

      - name: 解析
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:actions
