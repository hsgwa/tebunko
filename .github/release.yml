# GitHub Release のリリースノート（gh release create --generate-notes）を、PR のラベルで分類する。
# 配布物を作るワークフローは workflows/release.yml で、このファイルとは別のもの
changelog:
  categories:
    # 互換が無くなる変更。ほかのラベルと併せて付けるので、最初に置いて先に振り分ける
    - title: 互換が無くなる変更
      labels: [breaking]
    - title: 機能
      labels: [enhancement]
    - title: 不具合の修正
      labels: [bug]
    - title: 文書
      labels: [documentation]
    - title: 依存の更新
      labels: [dependencies]
    - title: その他
      labels: ["*"]
